<!doctype html>
<!-- THROWAWAY TEST PAGE (10/9) — the in-app-browser walk. Unlisted, noindex, not in the sitemap, not linked from
     any page. Answers two questions from inside Reddit's browser: does an x-safari-https:// link open Safari, and
     what does this browser say about itself (can a page tell it's inside Reddit). Delete after the walk. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Elitr — browser walk</title>
  <style>
    :root { --bg: #0a0b0d; --ink: #f7f5f1; --mute: #a8a49c; --gold: #b89a5a; --line: #2a2b2f; }
    @media (prefers-color-scheme: light) { :root { --bg: #f7f5f1; --ink: #0e0f11; --mute: #5c5952; --line: #d9d4ca; } }
    body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .from { font-size: 22px; color: var(--gold); margin: 8px 0 20px; }
    a.btn { display: block; margin: 10px 0; padding: 14px 16px; border: 1px solid var(--gold); border-radius: 12px; color: var(--ink); text-decoration: none; }
    a.btn small { display: block; color: var(--mute); font-size: 12px; word-break: break-all; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--gold); background: transparent; color: var(--ink); }
  </style>
</head>
<body>
  <h1>Browser walk</h1>
  <div class="from" id="from"></div>

  <a class="btn" href="x-safari-https://www.elitr.ai/walk/?from=x-safari">1 · Open in Safari (x-safari-https)<small>x-safari-https://www.elitr.ai/walk/?from=x-safari</small></a>
  <a class="btn" href="googlechromes://www.elitr.ai/walk/?from=chrome-scheme">2 · Open in Chrome (googlechromes)<small>googlechromes://www.elitr.ai/walk/?from=chrome-scheme</small></a>
  <a class="btn" href="https://www.elitr.ai/walk/?from=plain-new-tab" target="_blank" rel="noopener">3 · Plain link, new tab<small>https://www.elitr.ai/walk/?from=plain-new-tab</small></a>

  <p>What this browser says about itself:</p>
  <pre id="out"></pre>
  <button id="copy" type="button">Copy this readout</button>

  <script>
    var q = new URLSearchParams(location.search);
    var from = q.get('from');
    document.getElementById('from').textContent = from ? 'Arrived via: ' + from : 'Arrived via: the Reddit post (no tag)';
    var mm = function (m) { try { return matchMedia(m).matches; } catch (e) { return 'n/a'; } };
    var lines = [
      'arrived via: ' + (from || 'post'),
      'userAgent: ' + navigator.userAgent,
      'navigator.standalone: ' + navigator.standalone,
      'display-mode standalone: ' + mm('(display-mode: standalone)'),
      'display-mode fullscreen: ' + mm('(display-mode: fullscreen)'),
      'display-mode browser: ' + mm('(display-mode: browser)'),
      'viewport: ' + innerWidth + 'x' + innerHeight + ' · screen: ' + screen.width + 'x' + screen.height,
      'referrer: ' + (document.referrer || '(none)'),
      'url: ' + location.href,
      'time: ' + new Date().toString()
    ];
    document.getElementById('out').textContent = lines.join('\n');
    document.getElementById('copy').addEventListener('click', function () {
      var t = lines.join('\n'), b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
        .then(function () { b.textContent = 'Copied'; })
        .catch(function () { b.textContent = 'Copy failed — screenshot instead'; });
    });
  </script>
</body>
</html>
