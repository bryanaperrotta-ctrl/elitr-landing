<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 220 220" color="#b89a5a">
  <title>Elitr</title>
  <defs>
    <!-- one intercardinal tick, NE; the other three are this one rotated -->
    <line id="tick" x1="47.7" y1="-47.7" x2="71.2" y2="-71.2" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.65"/>
    <!-- one cardinal axis, N–S; E–W is this one rotated -->
    <line id="axis" x1="0" y1="-101.5" x2="0" y2="101.5" stroke="currentColor" stroke-width="3"/>
    <!-- the aircraft's left half; the right half is this one mirrored -->
    <g id="half" fill="currentColor">
      <path d="M0,-90 C-2.6,-86 -6,-72 -6,-40 L-6,40 C-6,55 -3.6,66 -3.3,73.5 L0,73.5 Z"/>
      <polygon points="-6,-9.75 -84,-1.5 -84,1.5 -6,11.25"/>
      <polygon points="-4.75,56.25 -30.25,64.75 -4.75,62.25"/>
      <polygon points="0,70.25 -13.25,86.25 0,86.25"/>
    </g>
  </defs>
  <g transform="translate(110 110)">
    <circle r="93.25" fill="none" stroke="currentColor" stroke-width="1.25" stroke-opacity="0.65"/>
    <circle r="74.75" fill="none" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.8"/>
    <use xlink:href="#tick"/>
    <use xlink:href="#tick" transform="rotate(90)"/>
    <use xlink:href="#tick" transform="rotate(180)"/>
    <use xlink:href="#tick" transform="rotate(270)"/>
    <use xlink:href="#axis"/>
    <use xlink:href="#axis" transform="rotate(90)"/>
    <use xlink:href="#half"/>
    <use xlink:href="#half" transform="scale(-1 1)"/>
  </g>
</svg>
